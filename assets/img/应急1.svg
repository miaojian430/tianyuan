    <text x="47.5" y="21" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="11" fill="#ffffff" font-weight="bold">信息服务输出</text>
    <text x="12" y="52" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">流程化融合</text>
    <text x="12" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">多源信息汇聚</text>
    <line x1="12" y1="76" x2="83" y2="76" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="12" y="92" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">场景化分析</text>
    <text x="12" y="108" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">灾前灾后对比</text>
    <line x1="12" y1="116" x2="83" y2="116" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="12" y="132" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">变化检测</text>
    <text x="12" y="148" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">损毁/淹没</text>
    <line x1="12" y1="156" x2="83" y2="156" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="47.5" y="178" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#2a9d8f">对接应急指挥</text>
    <text x="47.5" y="192" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#2a9d8f">系统</text>
  </g>

  <!-- 底部：适用对象 -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="360" height="120" rx="10" fill="#ffffff" filter="url(#cardShadow)" opacity="0.92"/>
    <text x="180" y="24" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="12" fill="#1e3a5f" font-weight="bold">面向非专业人员的应急信息服务</text>

    <!-- 应急管理与救援 -->
    <g transform="translate(14, 42)">
      <rect x="0" y="0" width="104" height="60" rx="6" fill="#f0f6fc" stroke="#c5d5e6" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">应急管理与救援</text>
      <text x="52" y="40" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">快速响应</text>
      <text x="52" y="54" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">信息补充</text>
    </g>
    <!-- 地方政府防灾减灾 -->
    <g transform="translate(128, 42)">
      <rect x="0" y="0" width="104" height="60" rx="6" fill="#f0f6fc" stroke="#c5d5e6" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">地方政府</text>
      <text x="52" y="40" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">防灾减灾</text>
      <text x="52" y="54" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">决策支持</text>
    </g>
    <!-- 现有应急指挥系统 -->
    <g transform="translate(242, 42)">
      <rect x="0" y="0" width="104" height="60" rx="6" fill="#f0f6fc" stroke="#c5d5e6" stroke-width="1"/>
      <text x="52" y="22" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">应急指挥系统</text>
      <text x="52" y="40" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">对接集成</text>
      <text x="52" y="54" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">能力补充</text>
    </g>
  </g>

  <!-- 连接线：数据源到主区域 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 90 116 Q 95 116 100 116"/>
    <path d="M 90 182 Q 95 170 100 160"/>
    <path d="M 90 248 Q 95 220 100 200"/>
  </g>
  <!-- 主区域到输出 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 460 180 Q 465 180 470 180"/>
  </g>
  <!-- 主区域到适用对象 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 280 298 Q 280 305 280 310"/>
  </g>

  <!-- 底部标题 -->
  <text x="287.5" y="468" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#1e3a5f" font-weight="bold">应急信息服务 · 天基影像与多源灾情信息流程化融合</text>
</svg>