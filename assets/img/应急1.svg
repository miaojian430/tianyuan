      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">灾情情报</text>
      <text x="12" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">实时汇聚</text>
    </g>
    <!-- 天基历史影像 -->
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="80" height="56" rx="6" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="56" rx="2" fill="#2a9d8f"/>
      <text x="12" y="20" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">天基历史</text>
      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">开源/闭源</text>
      <text x="12" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">存档影像</text>
    </g>
    <!-- 天基实时影像 -->
