      <rect x="0" y="0" width="80" height="56" rx="6" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="56" rx="2" fill="#2a9d8f"/>
      <text x="12" y="20" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">天基实时</text>
      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">实时影像</text>
      <text x="12" y="50" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">快速获取</text>
    </g>
