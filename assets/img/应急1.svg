    <rect x="0" y="0" width="295" height="38" rx="19" fill="#1e3a5f" filter="url(#cardShadow)"/>
    <text x="147.5" y="24" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#ffffff" font-weight="bold">自然语言交互 · 自动拉取灾前灾后影像</text>
  </g>

  <!-- 主区域：灾前灾后对比 -->
  <g transform="translate(100, 68)">
    <rect x="0" y="0" width="360" height="230" rx="10" fill="#ffffff" opacity="0.92" filter="url(#cardShadow)"/>

    <!-- 灾前影像 -->
    <g transform="translate(12, 12)">
      <rect x="0" y="0" width="164" height="140" rx="6" fill="url(#imgBefore)" stroke="#a8c4a0" stroke-width="1.2"/>
      <!-- 简化地物 -->
      <rect x="18" y="20" width="30" height="22" rx="2" fill="#8fae88" opacity="0.7"/>
      <rect x="58" y="20" width="26" height="22" rx="2" fill="#8fae88" opacity="0.7"/>
      <rect x="94" y="20" width="34" height="22" rx="2" fill="#8fae88" opacity="0.7"/>
      <rect x="18" y="52" width="26" height="24" rx="2" fill="#8fae88" opacity="0.7"/>
      <rect x="54" y="52" width="38" height="24" rx="2" fill="#8fae88" opacity="0.7"/>
      <rect x="102" y="52" width="26" height="24" rx="2" fill="#8fae88" opacity="0.7"/>
      <path d="M 0 100 Q 40 92 80 100 T 164 96 L 164 140 L 0 140 Z" fill="#a8c8e0" opacity="0.6"/>
      <text x="82" y="128" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#3a5a3a">灾前影像</text>
    </g>

    <!-- 灾后影像 -->
    <g transform="translate(184, 12)">
      <rect x="0" y="0" width="164" height="140" rx="6" fill="url(#imgAfter)" stroke="#c4a090" stroke-width="1.2"/>
      <!-- 损毁地物 -->
      <rect x="18" y="20" width="30" height="22" rx="2" fill="#b08878" opacity="0.7"/>
      <rect x="58" y="20" width="26" height="22" rx="2" fill="#c4a090" opacity="0.5"/>
      <rect x="94" y="20" width="34" height="22" rx="2" fill="#b08878" opacity="0.7"/>
      <rect x="18" y="52" width="26" height="24" rx="2" fill="#c4a090" opacity="0.5"/>
      <rect x="54" y="52" width="38" height="24" rx="2" fill="#b08878" opacity="0.7"/>
      <rect x="102" y="52" width="26" height="24" rx="2" fill="#c4a090" opacity="0.5"/>
      <!-- 淹没范围 -->
      <path d="M 0 88 Q 40 78 80 88 T 164 82 L 164 140 L 0 140 Z" fill="#7aa8c8" opacity="0.7"/>
      <path d="M 0 88 Q 40 78 80 88 T 164 82" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="82" y="128" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#5a3a2a">灾后影像</text>
    </g>

    <!-- 变化检测箭头 -->
    <g transform="translate(170, 78)">
      <path d="M 0 0 L 14 0" stroke="#e67e22" stroke-width="2"/>
      <polygon points="14,-4 22,0 14,4" fill="#e67e22"/>
    </g>

    <!-- 变化检测标签 -->
    <g transform="translate(120, 160)">
      <rect x="0" y="0" width="80" height="22" rx="11" fill="#fdf0e0" stroke="#e67e22" stroke-width="1"/>
      <text x="40" y="15" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#a04000">变化检测</text>
    </g>
    <g transform="translate(210, 160)">
      <rect x="0" y="0" width="100" height="22" rx="11" fill="#fdf0e0" stroke="#e67e22" stroke-width="1"/>
      <text x="50" y="15" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#a04000">建筑物损毁分析</text>
    </g>

    <!-- 分析结果标签 -->
    <g transform="translate(40, 194)">
      <rect x="0" y="0" width="120" height="22" rx="11" fill="#e8f4f8" stroke="#2a9d8f" stroke-width="1"/>
      <text x="60" y="15" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f">水体淹没范围提取</text>
    </g>
    <g transform="translate(190, 194)">
      <rect x="0" y="0" width="130" height="22" rx="11" fill="#e8f4f8" stroke="#2a9d8f" stroke-width="1"/>
      <text x="65" y="15" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f">灾情要素对比分析</text>
    </g>
