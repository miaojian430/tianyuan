<svg width="575" height="490.67" viewBox="0 0 575 490.67" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#e2ecf5"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4e6f1"/>
      <stop offset="100%" stop-color="#b8d4e8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#1e3a5f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="575" height="490.67" fill="url(#bgGrad)"/>

  <!-- 细网格 -->
  <g stroke="#c5d5e6" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60" x2="575" y2="60"/>
    <line x1="0" y1="120" x2="575" y2="120"/>
    <line x1="0" y1="180" x2="575" y2="180"/>
    <line x1="0" y1="240" x2="575" y2="240"/>
    <line x1="0" y1="300" x2="575" y2="300"/>
    <line x1="0" y1="360" x2="575" y2="360"/>
    <line x1="0" y1="420" x2="575" y2="420"/>
    <line x1="60" y1="0" x2="60" y2="490.67"/>
    <line x1="120" y1="0" x2="120" y2="490.67"/>
    <line x1="180" y1="0" x2="180" y2="490.67"/>
    <line x1="240" y1="0" x2="240" y2="490.67"/>
    <line x1="300" y1="0" x2="300" y2="490.67"/>
    <line x1="360" y1="0" x2="360" y2="490.67"/>
    <line x1="420" y1="0" x2="420" y2="490.67"/>
    <line x1="480" y1="0" x2="480" y2="490.67"/>
    <line x1="540" y1="0" x2="540" y2="490.67"/>
  </g>

  <!-- 中央认知中枢 -->
  <g transform="translate(170, 15)">
    <rect x="0" y="0" width="235" height="36" rx="18" fill="#1e3a5f" filter="url(#cardShadow)"/>
    <text x="117.5" y="23" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#ffffff" font-weight="bold">认知智能中枢 · 多源融合与专用算法</text>
  </g>

  <!-- 主地图卡片 -->
  <g transform="translate(100, 65)">
    <rect x="0" y="0" width="360" height="320" rx="10" fill="#ffffff" opacity="0.9" filter="url(#cardShadow)"/>
    <clipPath id="mapClip">
      <rect x="0" y="0" width="360" height="320" rx="10"/>
    </clipPath>
    <g clip-path="url(#mapClip)">
      <!-- 海洋 -->
      <path d="M 0 30 Q 90 10 180 40 T 360 30 L 360 320 L 0 320 Z" fill="url(#seaGrad)"/>
      <!-- 陆地 -->
      <path d="M 0 30 Q 90 10 180 40 T 360 30 L 360 80 Q 280 100 200 90 T 60 100 Q 20 95 0 80 Z" fill="#f5f0e1" stroke="#c0b090" stroke-width="1.5"/>
      <path d="M 360 30 L 360 80 Q 340 75 320 70 T 280 60 Q 320 40 360 30 Z" fill="#f5f0e1" stroke="#c0b090" stroke-width="1.5"/>
      
      <!-- 海图网格 -->
      <g stroke="#a8c4dc" stroke-width="0.6" opacity="0.4">
        <line x1="0" y1="80" x2="360" y2="80"/>
        <line x1="0" y1="130" x2="360" y2="130"/>
        <line x1="0" y1="180" x2="360" y2="180"/>
        <line x1="0" y1="230" x2="360" y2="230"/>
        <line x1="0" y1="280" x2="360" y2="280"/>
        <line x1="80" y1="0" x2="80" y2="320"/>
        <line x1="160" y1="0" x2="160" y2="320"/>
        <line x1="240" y1="0" x2="240" y2="320"/>
        <line x1="320" y1="0" x2="320" y2="320"/>
      </g>

      <!-- 油膜范围 -->
      <path d="M 160 150 Q 210 120 270 140 T 330 180 Q 310 220 250 230 T 140 200 Q 120 170 160 150 Z"
            fill="#2c3e50" opacity="0.3" stroke="#e67e22" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="220" y="195" font-family="'Microsoft YaHei', sans-serif" font-size="12" fill="#ffffff" opacity="0.9" text-anchor="middle">油膜区</text>

      <!-- 船舶AIS轨迹 -->
      <path d="M 30 250 Q 110 220 190 240 T 340 210" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 5"/>
      <g fill="#c0392b">
        <polygon points="30,250 38,246 36,254"/>
        <polygon points="190,240 198,236 196,244"/>
        <polygon points="340,210 348,206 346,214"/>
      </g>

      <!-- 气象海流 -->
      <g stroke="#16a085" stroke-width="1.8" fill="none">
        <path d="M 280 260 Q 310 240 340 250"/>
        <polygon points="340,250 332,246 335,255" fill="#16a085"/>
        <path d="M 260 280 Q 290 270 320 278"/>
        <polygon points="320,278 312,274 315,283" fill="#16a085"/>
      </g>
      <text x="285" y="295" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#0e6655">气象海流</text>

      <!-- 起始点反演 -->
      <circle cx="190" cy="170" r="10" fill="none" stroke="#e67e22" stroke-width="2"/>
      <circle cx="190" cy="170" r="3" fill="#e67e22"/>
      <line x1="190" y1="158" x2="190" y2="145" stroke="#e67e22" stroke-width="1.5"/>
      <text x="165" y="138" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#a04000">起始点反演</text>

      <!-- 嫌疑船舶标记 -->
      <g>
        <circle cx="130" cy="225" r="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
        <text x="115" y="218" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#922b21">嫌疑船A</text>
        <circle cx="250" cy="230" r="5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
        <text x="235" y="223" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#922b21">嫌疑船B</text>
      </g>

      <!-- 专用算法小标签（已修复坐标越界与遮挡问题） -->
      <g transform="translate(30, 260)">
        <rect x="0" y="0" width="72" height="20" rx="10" fill="#e8f4f8" stroke="#2a9d8f" stroke-width="1"/>
        <text x="36" y="14" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#1e3a5f">油膜识别</text>
      </g>
      <g transform="translate(132, 260)">
        <rect x="0" y="0" width="82" height="20" rx="10" fill="#e8f4f8" stroke="#2a9d8f" stroke-width="1"/>
        <text x="41" y="14" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#1e3a5f">起始点反演</text>
      </g>
      <g transform="translate(244, 260)">
        <rect x="0" y="0" width="86" height="20" rx="10" fill="#e8f4f8" stroke="#2a9d8f" stroke-width="1"/>
        <text x="43" y="14" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" fill="#1e3a5f">船舶特征分析</text>
      </g>
    </g>
  </g>

  <!-- 左侧数据源卡片 -->
  <g transform="translate(10, 90)">
    <!-- 天基遥感影像 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="52" rx="6" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#2a9d8f"/>
      <text x="12" y="20" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">天基遥感</text>
      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">历史影像</text>
      <text x="12" y="48" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">油膜识别</text>
    </g>
    <!-- 气象海流数据 -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="80" height="52" rx="6" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#16a085"/>
      <text x="12" y="20" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">气象海流</text>
      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">风场/流场</text>
      <text x="12" y="48" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">扩散分析</text>
    </g>
    <!-- 船舶AIS轨迹 -->
    <g transform="translate(0, 124)">
      <rect x="0" y="0" width="80" height="52" rx="6" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#c0392b"/>
      <text x="12" y="20" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">船舶AIS</text>
      <text x="12" y="36" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">航迹/特征</text>
      <text x="12" y="48" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">比对分析</text>
    </g>
  </g>

  <!-- 右侧输出卡片 -->
  <g transform="translate(470, 90)">
    <rect x="0" y="0" width="95" height="190" rx="8" fill="#ffffff" filter="url(#cardShadow)" opacity="0.95"/>
    <rect x="0" y="0" width="95" height="32" rx="8" fill="#1e3a5f"/>
    <text x="47.5" y="21" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="11" fill="#ffffff" font-weight="bold">嫌疑船舶排序</text>
    <text x="12" y="52" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">1. 嫌疑船A</text>
    <text x="12" y="68" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">证据链完整</text>
    <line x1="12" y1="76" x2="83" y2="76" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="12" y="92" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">2. 嫌疑船B</text>
    <text x="12" y="108" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">轨迹吻合</text>
    <line x1="12" y1="116" x2="83" y2="116" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="12" y="132" font-family="'Microsoft YaHei', sans-serif" font-size="10" fill="#1e3a5f" font-weight="bold">3. 嫌疑船C</text>
    <text x="12" y="148" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#5d6d7e">待核查</text>
    <line x1="12" y1="156" x2="83" y2="156" stroke="#d0dbe8" stroke-width="0.8"/>
    <text x="47.5" y="178" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="9" fill="#2a9d8f">输出证据链</text>
  </g>

  <!-- 连接线：数据源到中枢 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 90 116 Q 130 116 170 50"/>
    <path d="M 90 178 Q 130 150 170 60"/>
    <path d="M 90 240 Q 140 200 180 70"/>
  </g>
  <!-- 中枢到地图 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 280 51 Q 300 70 320 90"/>
    <path d="M 260 51 Q 260 70 250 90"/>
  </g>
  <!-- 中枢到输出 -->
  <g stroke="#2a9d8f" stroke-width="1.2" fill="none" stroke-dasharray="4 3" opacity="0.6">
    <path d="M 405 51 Q 440 70 470 100"/>
  </g>

  <!-- 底部标题 -->
  <text x="287.5" y="470" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#1e3a5f" font-weight="bold">海洋石油污染 · 多源信息融合与证据链分析</text>
</svg>